# Firebase web config, API base URL, and reCAPTCHA site key are intentionally public
# (NEXT_PUBLIC_*). Netlify secrets scanning still pattern-matches them in the client
# bundle, so they are omitted here. Do not put private secrets in NEXT_PUBLIC_* vars.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_API_BASE_URL,NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
